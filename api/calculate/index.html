<head>

  <!-- Critical above-the-fold CSS -->

m;padding-top:100px} .slide-title{font-size:clamp(2rem,5vw,4rem);color:#0f172a;margin-bottom:1rem;line-height:1.1} .product-detail-hero{padding:8rem 0 3rem;background:linear-gradient(180deg,#fbf8f1,#fff)} .cluster-hero{padding:3rem 0 2.5rem;background:linear-gradient(180deg,#fbf8f1,#fff);border-bottom:1px solid rgba(184,137,61,.15)} .cluster-hero-grid{display:grid;grid-template-columns:1fr;gap:2rem;align-items:center} .cluster-hero h1{font-family:var(--font-serif);font-size:clamp(1.85rem,3.5vw,2.6rem);color:#0f172a;margin:0 0 .85rem;line-height:1.15} .page-header-bg{min-height:280px;background-size:cover;background-position:center} .founder-strip{padding:3rem 0;background:linear-gradient(180deg,#fffcf4,#fffaf0);border-top:1px solid rgba(184,137,61,.18);border-bottom:1px solid rgba(184,137,61,.18)} @media(min-width:768px){.container{padding:0 1.5rem}.cluster-hero-grid{grid-template-columns:1.1fr 1fr}} @media(min-width:1024px){.container{padding:0 2rem}}</style>
  <link rel="stylesheet" href="../../css/site-nav.css?v=20260601">
  <link rel="stylesheet" href="../../css/site-footer.css">
</head>
<body>
  <pre id="out">Loading pricing data…</pre>
  <script defer src="../../data/pricing-engine.js"></script>
  <script>
(function () {
  var params = new URLSearchParams(location.search);

  function render(obj) {
    var text = JSON.stringify(obj, null, 2);
    if (params.get('format') === 'json' || params.get('callback')) {
      document.body.innerHTML = '';
      document.body.style.margin = '0';
      var pre = document.createElement('pre');
      pre.style.cssText = 'margin:0;padding:1rem;font:13px/1.4 monospace;white-space:pre-wrap;';
      pre.textContent = text;
      document.body.appendChild(pre);
    } else {
      document.getElementById('out').textContent = text;
    }
    document.title = obj.error ? 'WoodenMax API — Error' : 'WoodenMax API — ₹' + (obj.result && obj.result.total_price);
  }

  function queryParams() {
    return {
      product: params.get('product') || params.get('productId'),
      productId: params.get('productId') || params.get('product'),
      width: params.get('width') || params.get('width_ft'),
      height: params.get('height') || params.get('height_ft'),
      quantity: params.get('quantity'),
      glass: params.get('glass'),
      mesh: params.get('mesh'),
      coating: params.get('coating'),
      trackOption: params.get('trackOption') || params.get('track'),
      lock: params.get('lock'),
      city: params.get('city'),
      voltage: params.get('voltage'),
      type: params.get('type'),
      profile: params.get('profile'),
      profileFinish: params.get('profileFinish') || params.get('finish'),
      wallMm: params.get('wallMm') || params.get('wall_mm'),
      outerFrame: params.get('outerFrame'),
    };
  }

  Promise.all([
    fetch('../../data/products.json').then(function (r) { return r.json(); }),
    fetch('../../data/rates.json').then(function (r) { return r.json(); }),
    fetch('../../data/mirror.json').then(function (r) { return r.json(); }),
  ])
    .then(function (arr) {
      window.WoodenMaxPricingEngine.init({ products: arr[0], rates: arr[1], mirror: arr[2] });
      var result = window.WoodenMaxPricingEngine.calculate(queryParams());
      var cb = params.get('callback');
      if (cb && /^[a-zA-Z_$][\w$]*$/.test(cb)) {
        document.body.innerHTML = '';
        document.write(cb + '(' + JSON.stringify(result) + ');');
        return;
      }
      render(result);
    })
    .catch(function (err) {
      render({
        api: 'WoodenMax Pricing Engine v1.0',
        error: true,
        message: 'Failed to load pricing data: ' + err.message,
        contact: { website: 'https://woodenmax.in' },
      });
    });
})();
  </script>
  <script src="../../js/site-footer.js?v=20260601" defer></script>
  <script src="../../js/nav-tree.js?v=20260601" defer></script>
  <script src="../../js/site-nav.js?v=20260601" defer></script></body>
</html>
